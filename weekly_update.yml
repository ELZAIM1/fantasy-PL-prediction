name: Weekly FPL Update

on:
  schedule:
    # Runs every Tuesday at 06:00 UTC - after Monday Night Football finishes
    # and FPL has finalized the previous gameweek's points.
    # Cron syntax: minute hour day month day-of-week
    - cron: "0 6 * * 2"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

# Gives the workflow permission to push commits back to this repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Force-refresh cached data
        # build_training_data.py skips fetching if player_histories.json
        # already exists - delete the cache every run so we always pull
        # fresh data instead of silently reusing last week's.
        run: rm -f data/bootstrap.json data/fixtures.json data/player_histories.json

      - name: Run pipeline
        run: |
          python fetch_data.py
          python load_data.py
          python build_training_data.py
          python train_model.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Weekly data update: $(date -u +'%Y-%m-%d')"
          git push
